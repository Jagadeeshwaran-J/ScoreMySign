services:
  signature-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signature-comparator
    image: signature-comparator:latest
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./outputs:/app/outputs       # visualizations land here on your Windows host
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - OUTPUT_DIR=/app/outputs      # path inside container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s